name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild desktop assets for
        required: true

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: targets
        run: |
          python3 scripts/release-matrix.py --self-test
          matrix=$(python3 scripts/release-matrix.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  desktop-apps:
    needs: release-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install Velopack CLI
        shell: bash
        run: |
          dotnet tool install --tool-path target/vpk vpk --version 1.2.110-ge826545
          echo "$GITHUB_WORKSPACE/target/vpk" >> "$GITHUB_PATH"
      - name: Select macOS updater architecture before signing and packaging
        if: runner.os == 'macOS'
        env:
          MACOS_ARCH: ${{ matrix.macos_arches }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          helpers = list(Path("target/vpk").rglob("UpdateMac"))
          assert len(helpers) == 1, helpers
          helper = helpers[0]
          thin = helper.with_suffix(".thin")
          subprocess.run(["lipo", str(helper), "-thin", os.environ["MACOS_ARCH"], "-output", str(thin)], check=True)
          thin.replace(helper)
          PY
      - name: Verify release tag
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "desktop") | .version')
          test "v${version}" = "$RELEASE_TAG"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          test ! -f /etc/apt/apt-mirrors.txt || sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get install -y dpkg-dev libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build native desktop app
        run: cargo build --release --locked -p desktop --target ${{ matrix.target }}
      - name: Stage Linux or Windows desktop app
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p target/velopack-input
          cp target/${{ matrix.target }}/release/${{ matrix.main_exe }} target/velopack-input/
          if [[ "$RUNNER_OS" == Linux ]]; then
            cp crates/desktop/assets/app-icon-512.png target/velopack-icon.png
          fi
      - name: Bundle macOS desktop app
        if: runner.os == 'macOS'
        run: scripts/package-macos-app --binary target/${{ matrix.target }}/release/castle-desktop
      - name: Build Velopack release
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          if [[ "$version" == *-* ]]; then
            channel=${version#*-}
            channel=${channel%%.*}
          else
            channel=stable
          fi
          echo "UPDATE_CHANNEL=$channel" >> "$GITHUB_ENV"

          args=(
            --packId Castle
            --packVersion "$version"
            --packDir "${{ matrix.pack_dir }}"
            --mainExe "${{ matrix.main_exe }}"
            --packTitle Castle
            --packAuthors "castle contributors"
            --channel "$channel"
            --outputDir target/velopack
            --delta None
          )
          if [[ -n "${{ matrix.velopack_runtime }}" ]]; then
            args+=(--runtime "${{ matrix.velopack_runtime }}")
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            args+=(--icon target/velopack-icon.png --categories Development)
          elif [[ "$RUNNER_OS" == Windows ]]; then
            args+=(--icon crates/desktop/assets/app-icon.ico)
          elif [[ "$RUNNER_OS" == macOS ]]; then
            args+=(--signAppIdentity=- --noInst)
          fi
          vpk pack "${args[@]}"
      - name: Build distribution installers
        shell: bash
        run: |
          assets_file="target/velopack/assets.${UPDATE_CHANNEL}.json"
          assets_tmp="${assets_file}.tmp"
          primary="${{ matrix.primary_asset }}"

          if [[ "$RUNNER_OS" == Linux ]]; then
            generated="Castle-${UPDATE_CHANNEL}.AppImage"
            mv "target/velopack/${generated}" "target/velopack/${primary}"
            secondary="${{ matrix.secondary_asset }}"
            scripts/package-deb \
              "target/${{ matrix.target }}/release/${{ matrix.main_exe }}" \
              "target/velopack/${secondary}"
            jq --arg generated "$generated" --arg primary "$primary" \
              'map(if .RelativeFileName == $generated then .RelativeFileName = $primary else . end)' \
              "$assets_file" > "$assets_tmp"
            mv "$assets_tmp" "$assets_file"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            staging=$(mktemp -d)
            ditto -x -k "target/velopack/Castle-${UPDATE_CHANNEL}-Portable.zip" "$staging"
            for binary in castle UpdateMac; do
              executable="$staging/Castle.app/Contents/MacOS/$binary"
              actual=$(lipo -archs "$executable" | tr ' ' '\n' | sort | xargs)
              expected=$(echo "${{ matrix.macos_arches }}" | tr ' ' '\n' | sort | xargs)
              test "$actual" = "$expected"
            done
            codesign --verify --deep --strict "$staging/Castle.app"
            ln -s /Applications "$staging/Applications"
            hdiutil create -volname Castle -srcfolder "$staging" -ov -format UDZO \
              "target/velopack/${primary}"
          else
            generated="Castle-${UPDATE_CHANNEL}-Setup.exe"
            mv "target/velopack/${generated}" "target/velopack/${primary}"
            jq --arg generated "$generated" --arg primary "$primary" \
              'map(if .RelativeFileName == $generated then .RelativeFileName = $primary else . end)' \
              "$assets_file" > "$assets_tmp"
            mv "$assets_tmp" "$assets_file"
          fi
      - name: Upload update feed and packages to R2
        shell: bash
        run: |
          vpk upload s3 \
            --outputDir target/velopack \
            --channel "$UPDATE_CHANNEL" \
            --endpoint "$R2_S3_ENDPOINT" \
            --region auto \
            --bucket "$R2_BUCKET" \
            --prefix "castle/$UPDATE_CHANNEL/${{ matrix.update_target }}" \
            --keyId "$R2_ACCESS_KEY_ID" \
            --secret "$R2_SECRET_ACCESS_KEY"
        env:
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Upload DMG or DEB to R2
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            asset="${{ matrix.primary_asset }}"
            content_type=application/x-apple-diskimage
          else
            asset="${{ matrix.secondary_asset }}"
            content_type=application/vnd.debian.binary-package
          fi
          aws s3 cp "target/velopack/${asset}" \
            "s3://${R2_BUCKET}/castle/${UPDATE_CHANNEL}/${{ matrix.update_target }}/${asset}" \
            --endpoint-url "$R2_S3_ENDPOINT" \
            --content-type "$content_type" \
            --no-progress
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
      - name: Remove retired installer name from R2
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            retired="Castle-${UPDATE_CHANNEL}.AppImage"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            retired="Castle-${UPDATE_CHANNEL}-Setup.pkg"
          else
            retired="Castle-${UPDATE_CHANNEL}-Setup.exe"
          fi
          key="castle/$UPDATE_CHANNEL/${{ matrix.update_target }}/$retired"
          aws s3api delete-object \
            --endpoint-url "$R2_S3_ENDPOINT" \
            --bucket "$R2_BUCKET" \
            --key "$key"
          if aws s3api head-object \
            --endpoint-url "$R2_S3_ENDPOINT" \
            --bucket "$R2_BUCKET" \
            --key "$key" >/dev/null 2>&1; then
            echo "Retired installer still exists: $key" >&2
            exit 1
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
      - name: Verify public update feed
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          base="${{ vars.R2_PUBLIC_BASE_URL }}/castle/${UPDATE_CHANNEL}/${{ matrix.update_target }}"
          feed="${base}/releases.${UPDATE_CHANNEL}.json?version=${version}"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$feed" \
            | jq -e --arg version "$version" '.Assets | any(.Version == $version and .Type == "Full")'
          assets=("${{ matrix.primary_asset }}")
          if [[ -n "${{ matrix.secondary_asset }}" ]]; then
            assets+=("${{ matrix.secondary_asset }}")
          fi
          for asset in "${assets[@]}"; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --head \
              "${base}/${asset}?version=${version}" >/dev/null
          done
      - name: Upload desktop installer to GitHub Release
        shell: bash
        run: |
          assets=("${{ matrix.primary_asset }}")
          if [[ -n "${{ matrix.secondary_asset }}" ]]; then
            assets+=("${{ matrix.secondary_asset }}")
          fi
          for asset in "${assets[@]}"; do
            gh release upload "$RELEASE_TAG" "target/velopack/${asset}" --clobber
          done
        env:
          GH_TOKEN: ${{ github.token }}
